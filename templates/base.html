<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Dashboard | Mi Aplicación{% endblock %}</title>
    <!-- Asumo que tu archivo CSS de Bootstrap está en /static/css/bootstrap.css -->
    <link rel="stylesheet" href="/static/css/bootstrap.css">
    
    <!-- Font Awesome (mantenido solo para el icono de usuario en el navbar superior) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* Contenedor principal de la barra lateral */
        .sidebar {
            height: 100vh;
            width: 250px;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            padding-top: 56px; /* Espacio para el navbar superior */
        }
        .content-wrapper {
            margin-left: 250px; /* Mueve el contenido */
            padding-top: 56px; /* Espacio para el navbar superior */
        }
        .bg-main-blue {
            background-color: rgb(30 58 138) !important; /* Tu color personalizado */
        }

        /* ------------------------------------------- */
        /* === ESTILOS PARA MENÚ SUPERIOR (HOVER) === */
        /* ------------------------------------------- */
        
        /* 1. Ocultar el menú por defecto y definir el posicionamiento manual */
        .navbar-nav .dropdown-menu {
            display: none !important; /* Forzamos la ocultación */
            position: absolute !important; 
            inset-inline-start: auto;
            right: 0; /* Alinea el borde derecho del menú al borde derecho del botón */
            
            /* AJUSTE DE POSICIÓN: Mueve el menú 20px a la izquierda, despegándolo */
            transform: translateX(-20px) !important; 
            margin-top: 0.125rem !important; 
            z-index: 1000;
        }

        /* 2. Mostrar el menú cuando se hace HOVER sobre el LI padre */
        .navbar-nav .dropdown:hover > .dropdown-menu {
            display: block !important; /* Forzamos la visualización al hacer hover */
        }

        /* ---------------------------------------------------- */
        /* === ESTILOS PARA SIDEBAR (NAV-PILLS y Hover) === */
        /* ---------------------------------------------------- */
        
        /* Estilo base para los nav-link del sidebar */
        .sidebar .nav-link {
            color: #495057; /* Texto por defecto */
            border-radius: .25rem;
            margin-bottom: 5px; /* Espacio entre pills */
            transition: background-color 0.15s ease; /* Transición suave para el hover */
        }
        
        /* HOVER: Efecto al pasar el ratón sobre cualquier elemento del menú */
        .sidebar .nav-link:hover {
            background-color: rgba(0, 0, 0, 0.05); /* Fondo gris muy claro */
            color: #212529;
        }
        
    </style>
</head>
<body>
    
    <!-- Navbar superior (Menú Hover y Posicionamiento Ajustado) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-main-blue fixed-top"> 
        <a class="navbar-brand px-3" href="/"><img src="/static/img/logo.jpg" alt="Logo de la Aplicación" height="30"></a>
        
        <div class="collapse navbar-collapse justify-content-end">
            <ul class="navbar-nav">
                <!-- Dropdown de Usuario controlado por CSS (Hover) -->
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" aria-expanded="false">
                        <i class="fas fa-user-circle"></i> {{ user_name }}
                    </a>
                    <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                        <li><a class="dropdown-item" href="#">Mi Perfil</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="/logout">Cerrar Sesión (Logout)</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </nav>
    
<!-- Sidebar (Barra Lateral Simplificada con Estilo Nav-Pills) -->
<div class="sidebar bg-light border-right">
    <div class="p-3"> 
        
        <div class="text-uppercase fw-bold text-secondary mb-3 mt-2">
            Navegación
        </div>
        
        <!-- Contenedor Nav-Pills Vertical (Solo enlaces simples) -->
        <div class="nav flex-column nav-pills" role="tablist" aria-orientation="vertical">

            <!-- Enlaces Simples (sin iconos ni submenús) -->
            <a class="nav-link" href="/">
                  Inicio
            </a>
            <a class="nav-link" href="/users/list">
                  Usuarios
            </a>
            <a class="nav-link" href="/materias">
                  Materias
            </a>
            <a class="nav-link" href="/doctorado">
                  Periodos academicos
            </a>
            <a class="nav-link" href="/facturacion">
                  Aranceles
            </a>
            <a class="nav-link" href="/facturacion">
                  Facturas
            </a>
            <a class="nav-link" href="/facturacion">
                  Inscripciones
            </a>
            <a class="nav-link" href="/facturacion">
                  Secciones
            </a>
            <a class="nav-link" href="/facturacion">
                  Registros Pagos
            </a>

        </div> <!-- Fin Contenedor Nav-Pills -->


    </div>
</div>
    
    <div class="content-wrapper">
        <div class="container-fluid p-4">
            {% block content %}
                {% endblock %}
        </div>
    </div>

    <!-- Mantenemos el JS de Bootstrap (aunque ya no se usa para el sidebar, es buena práctica) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block script_footer %}{% endblock %}
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Dashboard | Mi Aplicación{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/bootstrap.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        .sidebar {
            height: 100vh;
            width: 250px;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            padding-top: 56px; /* Espacio para el navbar superior */
        }
        .content-wrapper {
            margin-left: 250px; /* Mueve el contenido */
            padding-top: 56px; /* Espacio para el navbar superior */
        }
        .bg-main-blue {
            background-color: rgb(30 58 138) !important; /* Tu color personalizado */
        }
    </style>
</head>
<body>
    
    <nav class="navbar navbar-expand-lg navbar-dark bg-main-blue fixed-top"> 
        <a class="navbar-brand px-3" href="/"><img src="/static/img/logo.jpg" alt="Logo de la Aplicación" height="30"></a>
        
        <div class="collapse navbar-collapse justify-content-end">
            <ul class="navbar-nav">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="fas fa-user-circle"></i> Usuario
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdown">
                        <li><a class="dropdown-item" href="#">Mi Perfil</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="/logout">Cerrar Sesión (Logout)</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </nav>
    
<div class="sidebar bg-light border-right">
    <div class="p-3"> 
        
        <div class="text-uppercase fw-bold text-secondary mb-3 mt-2">
            Navegación
        </div>
        
        <a href="/dashboard" class="list-group-item list-group-item-action bg-light border-0">
            <i class="fas fa-home me-2"></i> Inicio
        </a>
        


        <a href="#ventas-sub" data-bs-toggle="collapse" aria-expanded="false" class="list-group-item list-group-item-action bg-light border-0 d-flex justify-content-between">
            <div><i class="fas fa-chart-line me-2"></i> Postgrado</div>
            <i class="fas fa-chevron-down small"></i>
        </a>
        
        <div class="collapse" id="ventas-sub">
            <a href="/ventas/pedidos" class="list-group-item list-group-item-action bg-light border-0 ps-5 small">
                Aranceles
            </a>
            <a href="/ventas/clientes" class="list-group-item list-group-item-action bg-light border-0 ps-5 small">
                Alumnos
            </a>
            <a href="/ventas/reportes" class="list-group-item list-group-item-action bg-light border-0 ps-5 small">
                Reportes
            </a>
        </div>
        


        <a href="#inventario-sub" data-bs-toggle="collapse" aria-expanded="false" class="list-group-item list-group-item-action bg-light border-0 d-flex justify-content-between">
            <div><i class="fas fa-warehouse me-2"></i> Doctorado</div>
            <i class="fas fa-chevron-down small"></i>
        </a>
        
        <div class="collapse" id="inventario-sub">
            <a href="/inventario/productos" class="list-group-item list-group-item-action bg-light border-0 ps-5 small">
                Alumnos
            </a>
            <a href="/inventario/entradas" class="list-group-item list-group-item-action bg-light border-0 ps-5 small">
                Reportes
            </a>
        </div>



        <a href="#inventario-sub" data-bs-toggle="collapse" aria-expanded="false" class="list-group-item list-group-item-action bg-light border-0 d-flex justify-content-between">
            <div><i class="fas fa-warehouse me-2"></i> Facturacion</div>
            <i class="fas fa-chevron-down small"></i>
        </a>
        
        <div class="collapse" id="inventario-sub">
            <a href="/inventario/productos" class="list-group-item list-group-item-action bg-light border-0 ps-5 small">
                Alumnos
            </a>
            <a href="/inventario/entradas" class="list-group-item list-group-item-action bg-light border-0 ps-5 small">
                Reportes
            </a>
        </div>





        </div>
</div>
    
    <div class="content-wrapper">
        <div class="container-fluid p-4">
            {% block content %}
                {% endblock %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

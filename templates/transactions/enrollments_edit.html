<!-- templates/transactions/enrollments_edit.html -->
{% extends "base.html" %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row">
        <div class="col-12">
            <div class="card mb-4">
                <div class="card-header pb-0">
                    <div class="d-flex align-items-center">
                        <h6 class="mb-0">Editar Inscripción</h6>
                    </div>
                </div>
                <div class="card-body px-4 pt-4 pb-4">
                    {% if flash_message %}
                    <div class="alert alert-info">{{ flash_message }}</div>
                    {% endif %}
                    
                    <form method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                        
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label class="form-control-label">Estudiante</label>
                                    <input class="form-control" type="text" value="{{ enrollment.student.name }} {{ enrollment.student.last_name }} - {{ enrollment.student.national_id }}" readonly>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label class="form-control-label">Sección actual</label>
                                    <input class="form-control" type="text" value="{{ enrollment.section.section_code }}" readonly>
                                </div>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="program_id" class="form-control-label">Programa</label>
                                    <select class="form-control" id="program_id" name="program_id" required>
                                        {% for program in programs %}
                                        <option value="{{ program.program_id }}" {% if program.program_id == enrollment.subject.program_id %}selected{% endif %}>
                                            {{ program.name }}
                                        </option>
                                        {% endfor %}
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="term_id" class="form-control-label">Período Académico</label>
                                    <select class="form-control" id="term_id" name="term_id" required>
                                        {% for term in terms %}
                                        <option value="{{ term.term_id }}" {% if term.term_id == enrollment.term_id %}selected{% endif %}>
                                            {{ term.name }} ({{ term.start_date.strftime('%d/%m/%Y') }} - {{ term.end_date.strftime('%d/%m/%Y') }})
                                        </option>
                                        {% endfor %}
                                    </select>
                                </div>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="bank_reference" class="form-control-label">Referencia Bancaria</label>
                                    <input class="form-control" type="text" id="bank_reference" name="bank_reference" value="{{ payment.bank_reference if payment else '' }}">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="payment_status" class="form-control-label">Estado del Pago</label>
                                    <select class="form-control" id="payment_status" name="payment_status">
                                    <option value="Pending Verification" {% if payment and payment.status == 'Pending Verification' %}selected{% endif %}>⏳ Pendiente por Aprobar</option>
                                    <option value="Approved" {% if payment and payment.status == 'Approved' %}selected{% endif %}>✅ Aprobado</option>
                                    <option value="Rejected" {% if payment and payment.status == 'Rejected' %}selected{% endif %}>❌ Rechazado</option>
                                </select>
                                </div>
                            </div>
                        </div>
                        
                        {% if payment and payment.proof_url %}
                        <div class="row">
                            <div class="col-12">
                                <div class="form-group">
                                    <label class="form-control-label">Comprobante de Pago</label>
                                    <div class="mt-2">
                                        {% if payment.proof_url.lower().endswith('.pdf') %}
                                            <a href="/static/uploads/payments/{{ payment.proof_url }}" target="_blank" class="btn btn-info btn-sm">
                                                <i class="fas fa-file-pdf"></i> Ver PDF
                                            </a>
                                        {% else %}
                                            <img src="/static/uploads/payments/{{ payment.proof_url }}" class="img-fluid img-thumbnail" style="max-height: 200px; cursor: pointer;" onclick="window.open(this.src)">
                                        {% endif %}
                                    </div>
                                </div>
                            </div>
                        </div>
                        {% endif %}
                        
                        <div class="row mt-4">
                            <div class="col-12 text-end">
                                <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                                <a href="/transactions/enrollments/list" class="btn btn-secondary">Cancelar</a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.querySelectorAll('img').forEach(img => {
    img.addEventListener('click', function() {
        window.open(this.src);
    });
});
</script>
{% endblock %}

{% extends "base.html" %}

{% block head %}
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2-bootstrap-5-theme@1.3.0/dist/select2-bootstrap-5-theme.min.css" />

<style>
    /* Ajuste para que Select2 use todo el ancho del contenedor */
    .select2-container { width: 100% !important; }
    .select2-selection { height: 38px !important; display: flex !important; align-items: center !important; }
</style>
{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="card shadow border-0">
        <div class="card-header bg-dark text-white">
            <h5 class="mb-0">Inscripciones</h5>
        </div>
        <div class="card-body">
            <form method="POST" action="/transactions/enrollments/create" enctype="multipart/form-data">
                
                <div class="mb-4">
                    <label class="form-label fw-bold">1. Seleccione al Estudiante</label>
                    <select name="student_id" id="student_search" class="form-select" required>
                        <option value="">Buscar por nombre, apellido o cédula...</option>
                        {% for s in students %}
                            <option value="{{ s.id }}">
                                {{ s.national_id }} - {{ s.last_name|upper }}, {{ s.name }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">2. Seleccione el Programa</label>
                    <select name="program_id" class="form-select" required>
                        <option value="">-- Elija una carrera --</option>
                        {% for p in programs %}
                            <option value="{{ p.program_id }}">{{ p.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="p-3 bg-light rounded border mb-4">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Referencia Bancaria</label>
                            <input type="text" name="bank_reference" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Comprobante (Imagen/PDF)</label>
                            <input type="file" name="voucher" class="form-control" accept="image/*,.pdf" required>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-success btn-lg w-100">Registrar Inscripción</button>
            </form>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<script>
    $(document).ready(function() {
        $('#student_search').select2({
            theme: 'bootstrap-5', // Si no usas el tema, quita esta línea
            placeholder: 'Escriba nombre o cédula...',
            allowClear: true,
            language: {
                noResults: function() { return "No se encontraron estudiantes"; }
            }
        });
    });
</script>
{% endblock %}

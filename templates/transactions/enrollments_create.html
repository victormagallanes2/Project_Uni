{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Inscripción Manual de Estudiante</h2>
    
    {% if flash_message %}
    <div class="alert alert-info">{{ flash_message }}</div>
    {% endif %}
    
    <form method="POST" enctype="multipart/form-data" class="mt-3" id="enrollmentForm">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        
        <div class="form-group mb-3">
            <label for="student_id">Estudiante:</label>
            <select name="student_id" id="student_id" class="form-control" style="width: 100%;" required>
                <option value="">Seleccione un estudiante...</option>
                {% for student in students %}
                <option value="{{ student.id }}">
                    {{ student.national_id }} - {{ student.name }} {{ student.last_name }}
                </option>
                {% endfor %}
            </select>
        </div>
        
        <div class="form-group mb-3">
            <label for="program_id">Programa:</label>
            <select name="program_id" id="program_id" class="form-control" required>
                <option value="">Seleccione programa...</option>
                {% for program in programs %}
                <option value="{{ program.program_id }}">{{ program.name }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="form-group mb-3">
            <label for="term_id">Período Académico:</label>
            <select name="term_id" id="term_id" class="form-control" required>
                <option value="">Seleccione período...</option>
                {% for term in terms %}
                <option value="{{ term.term_id }}">{{ term.name }} ({{ term.start_date.strftime('%d/%m/%Y') }} - {{ term.end_date.strftime('%d/%m/%Y') }})</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="form-group mb-3">
            <label for="bank_reference">Referencia Bancaria:</label>
            <input type="text" name="bank_reference" id="bank_reference" class="form-control" required>
        </div>
        
        <div class="form-group mb-3">
            <label for="voucher">Comprobante de Pago:</label>
            <input type="file" name="voucher" id="voucher" class="form-control" accept="image/*,.pdf" required onchange="previewFile(this)">
            
            <div id="preview-container" class="mt-2" style="display: none;">
                <p class="mb-1"><strong>Vista previa:</strong></p>
                <img id="image-preview" src="#" alt="Vista previa" class="img-thumbnail" style="max-height: 200px; display: none;">
                <div id="pdf-preview" class="alert alert-info" style="display: none;">
                    <i class="fas fa-file-pdf"></i> Archivo PDF seleccionado
                </div>
            </div>
        </div>
        
        <button type="submit" class="btn btn-primary">Realizar Inscripción</button>
        <a href="/transactions/enrollments/list" class="btn btn-secondary">Cancelar</a>
    </form>
</div>

<!-- PRIMERO: Cargar jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<!-- SEGUNDO: Cargar Select2 CSS y JS -->
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<!-- TERCERO: Font Awesome para iconos -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

<!-- CUARTO: Nuestro script -->
<script>
// Esperar a que el DOM esté listo
$(document).ready(function() {
    console.log("✅ jQuery está funcionando");
    console.log("✅ Select2 disponible:", typeof $.fn.select2 !== 'undefined');
    
    try {
        // Inicializar Select2 en el select de estudiantes
        $('#student_id').select2({
            placeholder: "Buscar estudiante por nombre o cédula...",
            allowClear: true,
            width: '100%',
            language: {
                noResults: function() {
                    return "No se encontraron estudiantes";
                },
                searching: function() {
                    return "Buscando...";
                }
            }
        });
        console.log("✅ Select2 inicializado correctamente");
    } catch (error) {
        console.error("❌ Error al inicializar Select2:", error);
    }
});

// Función para vista previa de imagen
function previewFile(input) {
    var previewContainer = document.getElementById('preview-container');
    var imagePreview = document.getElementById('image-preview');
    var pdfPreview = document.getElementById('pdf-preview');
    
    if (input.files && input.files[0]) {
        var file = input.files[0];
        var fileType = file.type;
        
        previewContainer.style.display = 'block';
        imagePreview.style.display = 'none';
        pdfPreview.style.display = 'none';
        
        if (fileType.match('image.*')) {
            var reader = new FileReader();
            reader.onload = function(e) {
                imagePreview.src = e.target.result;
                imagePreview.style.display = 'block';
            }
            reader.readAsDataURL(file);
        }
        else if (fileType === 'application/pdf') {
            pdfPreview.style.display = 'block';
            pdfPreview.innerHTML = '<i class="fas fa-file-pdf"></i> Archivo PDF: ' + file.name;
        }
        else {
            previewContainer.style.display = 'none';
        }
    } else {
        previewContainer.style.display = 'none';
    }
}
</script>
{% endblock %}

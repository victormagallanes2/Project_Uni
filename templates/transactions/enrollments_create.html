{% extends "base.html" %}

{% block title %}Realizar Inscripción{% endblock %}

{% block content %}
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/select2-bootstrap-5-theme@1.3.0/dist/select2-bootstrap-5-theme.min.css" rel="stylesheet" />

<div class="row">
    <div class="col-12"><h1 class="mb-4">Inscribir Estudiante</h1></div>
</div>

<div class="row">
    <div class="col-lg-8">
        <div class="card shadow-sm">
            <div class="card-body">
                <form method="POST" action="/enrollments/create">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                    <div class="mb-4">
                        <label class="form-label fw-bold">1. Seleccionar Estudiante</label>
                        <select class="form-select" name="student_user_id" id="buscador-estudiantes" required>
                            <option value="">Escriba nombre o cédula...</option>
                            {% for student in students %}
                            <option value="{{ student.id }}">
                                {{ student.last_name }}, {{ student.name }} ({{ student.national_id }})
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">2. Seleccionar Sección</label>
                        <select class="form-select" name="section_id" id="buscador-secciones" required>
                            <option value="">Seleccione la sección...</option>
                            {% for section in sections %}
                            <option value="{{ section.section_id }}">
                                {{ section.section_code }} - {{ section.subject.name }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="d-flex justify-content-end mt-4">
                        <a href="/enrollments/list" class="btn btn-secondary me-2">Cancelar</a>
                        <button type="submit" class="btn btn-primary btn-lg">Procesar Inscripción</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<script>
    // Forzamos la ejecución inmediata sin esperar al "ready" de la base
    (function() {
        var intentar = setInterval(function() {
            if (typeof jQuery !== 'undefined' && !!$.fn.select2) {
                $('#buscador-estudiantes, #buscador-secciones').select2({
                    theme: 'bootstrap-5',
                    width: '100%',
                    placeholder: 'Escriba para buscar...',
                    language: {
                        noResults: function() { return "No se encontraron resultados"; }
                    }
                });
                console.log("¡Buscador Select2 activado manualmente!");
                clearInterval(intentar);
            }
        }, 100);
    })();
</script>
{% endblock %}

{% extends "base.html" %}

{% block title %}Crear Materia{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12"><h1 class="mb-4">Registrar Nueva Materia</h1></div>
</div>

<div class="row">
    <div class="col-lg-6"> 
        <div class="card shadow-sm">
            <div class="card-body">
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    
                    <div class="mb-3">
                        <label class="form-label font-weight-bold">Programa Académico</label>
                        <select name="program_id" class="form-select" required>
                            <option value="" disabled selected>Seleccione el programa...</option>
                            {% for prog in programs %}
                            <option value="{{ prog.program_id }}">{{ prog.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="row">
                        <div class="col-md-8 mb-3">
                            <label class="form-label font-weight-bold">Nombre de la Materia</label>
                            <input type="text" name="name" class="form-control" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label font-weight-bold">Unidades de Crédito (UC)</label>
                            <input type="number" name="credits" class="form-control" min="1" max="20" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label font-weight-bold">Código Interno</label>
                        <input type="text" name="code" class="form-control" placeholder="Ej: MAT-101" required>
                    </div>

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary btn-lg">Guardar Materia</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

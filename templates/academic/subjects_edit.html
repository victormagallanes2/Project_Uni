{% extends "base.html" %}

{% block title %}Editar Materia | {{ subject.code }}{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 offset-md-2">
        <h1 class="mb-4">Editar Materia</h1>
        
        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <div class="card shadow-sm border-primary">
            <div class="card-header bg-primary text-white">
                <i class="fas fa-edit me-2"></i> Datos de la Asignatura
            </div>
            <div class="card-body">
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                    <div class="mb-3">
                        <label class="form-label fw-bold">Programa Académico</label>
                        <select name="program_id" class="form-select" required>
                            {% for prog in programs %}
                            <option value="{{ prog.program_id }}" {% if subject.program_id == prog.program_id %}selected{% endif %}>
                                {{ prog.name }} ({{ prog.level }})
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label fw-bold">Código</label>
                            <input type="text" name="code" class="form-control" value="{{ subject.code }}" required>
                        </div>
                        <div class="col-md-8 mb-3">
                            <label class="form-label fw-bold">Nombre de la Materia</label>
                            <input type="text" name="name" class="form-control" value="{{ subject.name }}" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Unidades de Crédito (UC)</label>
                        <input type="number" name="credits" class="form-control" value="{{ subject.credits }}" min="1" required>
                    </div>

                    <div class="d-flex justify-content-end mt-4">
                        <a href="/academic/subjects/list" class="btn btn-secondary me-2">Cancelar</a>
                        <button type="submit" class="btn btn-success">
                            <i class="fas fa-save me-1"></i> Guardar Cambios
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h1>Editar Sección: {{ section.section_code }}</h1>
    <hr>

    <form method="POST">
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Código de la Sección</label>
                <input type="text" name="section_code" class="form-control" value="{{ section.section_code }}" required>
            </div>
            
            <div class="col-md-4 mb-3">
                <label class="form-label">Periodo Académico</label>
                <select name="term_id" class="form-select" required>
                    {% for term in terms %}
                    <option value="{{ term.term_id }}" {% if term.term_id == section.term_id %} selected {% endif %}>
                        {{ term.name }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-md-2 mb-3">
                <label class="form-label">Capacidad</label>
                <input type="number" name="capacity" class="form-control" value="{{ section.capacity }}" required>
            </div>
        </div>

        <div class="card mt-4 border-info">
            <div class="card-header bg-info text-white">
                <strong>Materias asignadas a este cohorte</strong>
            </div>
            <div class="card-body" style="max-height: 400px; overflow-y: auto;">
                <p class="text-muted small">Marca o desmarca las materias que componen este grupo académico.</p>
                <div class="row">
                    {% for subject in subjects %}
                    <div class="col-md-4 mb-3">
                        <div class="form-check p-2 border rounded">
                            <input class="form-check-input ms-1" type="checkbox" name="subject_ids" 
                                   value="{{ subject.subject_id }}" id="sub_{{ subject.subject_id }}"
                                   {% if subject.subject_id in current_subject_ids %} checked {% endif %}>
                            <label class="form-check-label ms-2" for="sub_{{ subject.subject_id }}">
                                <strong>{{ subject.name }}</strong><br>
                                <small class="text-muted">{{ subject.code }}</small>
                            </label>
                        </div>
                    </div>
                    {% endfor %}
                </div>
            </div>
        </div>

        <div class="mt-4 pb-5">
            <button type="submit" class="btn btn-primary btn-lg">Actualizar Cambios</button>
            <a href="/academic/sections" class="btn btn-outline-secondary btn-lg">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}

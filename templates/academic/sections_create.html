{% extends "base.html" %}

{% block content %}
<h1>Crear Nueva Sección (Cohorte)</h1>

<form method="POST" class="mt-4">
    <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label">Código de la Sección</label>
            <input type="text" name="section_code" class="form-control" placeholder="Ej: INF-01A" required>
        </div>
        
        <div class="col-md-6 mb-3">
            <label class="form-label">Periodo Académico</label>
            <select name="term_id" class="form-select" required>
                {% for term in terms %}
                <option value="{{ term.term_id }}">{{ term.name }}</option>
                {% endfor %}
            </select>
        </div>
    </div>

    <div class="card mt-4">
        <div class="card-header bg-light">
            <strong>Selecciona las materias para este grupo</strong>
        </div>
        <div class="card-body" style="max-height: 300_px; overflow-y: auto;">
            <div class="row">
                {% for subject in subjects %}
                <div class="col-md-4 mb-2">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="subject_ids" value="{{ subject.subject_id }}" id="sub_{{ subject.subject_id }}">
                        <label class="form-check-label" for="sub_{{ subject.subject_id }}">
                            {{ subject.name }} <br>
                            <small class="text-muted">{{ subject.code }}</small>
                        </label>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>

    <div class="mt-4">
        <button type="submit" class="btn btn-success">Guardar Sección</button>
        <a href="/academic/sections/list" class="btn btn-secondary">Cancelar</a>
    </div>
</form>
{% endblock %}

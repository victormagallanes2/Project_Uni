{% extends "base.html" %}

{% block title %}Editar Período | {{ term.name }}{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <h1 class="mb-4">Editar Período: {{ term.name }}</h1>
    </div>
</div>

<div class="row">
    <div class="col-lg-8"> 
        <div class="card shadow-sm">
            <div class="card-body">
                <form method="POST" action="/academic/terms/edit/{{ term.term_id }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    
                    <div class="mb-3">
                        <label class="form-label">Nombre del Período</label>
                        <input type="text" class="form-control" name="name" value="{{ term.name }}" required>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Inicio de Clases</label>
                            <input type="date" class="form-control" name="start_date" value="{{ term.start_date }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Fin de Clases</label>
                            <input type="date" class="form-control" name="end_date" value="{{ term.end_date }}" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Inicio de Inscripción</label>
                            <input type="date" class="form-control" name="enrollment_start_date" value="{{ term.enrollment_start_date }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Fin de Inscripción</label>
                            <input type="date" class="form-control" name="enrollment_end_date" value="{{ term.enrollment_end_date }}" required>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end mt-4">
                        <a href="/academic/terms/list" class="btn btn-secondary me-2">Cancelar</a>
                        <button type="submit" class="btn btn-success">
                            <i class="fas fa-save me-1"></i> Actualizar Período
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

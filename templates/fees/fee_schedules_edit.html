{% extends "base.html" %}

{% block title %}Editar Tarifa{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12"><h1 class="mb-4">Modificar Monto de Tarifa</h1></div>
</div>

<div class="row">
    <div class="col-lg-7"> 
        <div class="card shadow-sm">
            <div class="card-body">
                <form method="POST" action="/fees/schedules/edit/{{ schedule.schedule_id }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    
                    <div class="mb-3">
                        <label class="form-label">Concepto</label>
                        <input type="text" class="form-control" value="{{ schedule.fee_concept.name }}" disabled>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Programa</label>
                        <input type="text" class="form-control" value="{{ schedule.program.name }}" disabled>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Nuevo Monto</label>
                        <div class="input-group">
                            <span class="input-group-text">$</span>
                            <input type="number" step="0.01" class="form-control" name="amount" value="{{ schedule.amount }}" required>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end mt-4">
                        <a href="/fees/schedules/list" class="btn btn-secondary me-2">Cancelar</a>
                        <button type="submit" class="btn btn-success">Actualizar Precio</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% extends "base.html" %}

{% block title %}Editar Tarifa{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12"><h1 class="mb-4">Modificar Monto de Tarifa</h1></div>
</div>

<div class="row">
    <div class="col-lg-7"> 
        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}
        
        <div class="card shadow-sm">
            <div class="card-body">
                <form method="POST" action="/fees/schedules/edit/{{ schedule.schedule_id }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    
                    <div class="mb-3">
                        <label class="form-label text-muted">Concepto (No editable)</label>
                        <input type="text" class="form-control bg-light" value="{{ schedule.concept.name }}" disabled>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-muted">Programa (No editable)</label>
                        <input type="text" class="form-control bg-light" value="{{ schedule.program.name }}" disabled>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Nuevo Monto en Bolívares</label>
                        <div class="input-group">
                            <span class="input-group-text">Bs.</span>
                            <input type="number" step="0.01" class="form-control form-control-lg" name="amount" value="{{ schedule.value_bs }}" required autofocus>
                        </div>
                        <div class="form-text">Ingrese el monto actualizado para esta tarifa.</div>
                    </div>

                    <div class="d-flex justify-content-end mt-4">
                        <a href="/fees/schedules/list" class="btn btn-secondary me-2">Cancelar</a>
                        <button type="submit" class="btn btn-success">Actualizar Precio</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

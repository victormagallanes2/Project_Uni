{% extends "base.html" %}

{% block title %}Crear Concepto{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12"><h1 class="mb-4">Nuevo Concepto de Pago</h1></div>
</div>

<div class="row">
    <div class="col-lg-6"> 
        <div class="card shadow-sm">
            <div class="card-body">
                <form method="POST" action="/fees/concepts/create">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    
                    <div class="mb-3">
                        <label class="form-label">Nombre del Concepto</label>
                        <input type="text" class="form-control" name="name" placeholder="Ej: Matrícula Semestral" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Categoría</label>
                        <input type="text" class="form-control" name="category" placeholder="Ej: Inscripción, Constancia...">
                    </div>

                    <div class="d-flex justify-content-end mt-4">
                        <a href="/fees/concepts/list" class="btn btn-secondary me-2">Cancelar</a>
                        <button type="submit" class="btn btn-primary">Guardar Concepto</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

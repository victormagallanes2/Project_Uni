{% extends "base.html" %}

{% block title %}Asignar Tarifa{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12"><h1 class="mb-4">Establecer Precio por Concepto</h1></div>
</div>

<div class="row">
    <div class="col-lg-7"> 
        <div class="card shadow-sm">
            <div class="card-body">
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                    <div class="mb-3">
                        <label class="form-label fw-bold">Concepto de Pago</label>
                        <select name="concept_id" class="form-select" required>
                            <option value="" disabled selected>Seleccione un concepto...</option>
                            {% for concept in concepts %}
                            <option value="{{ concept.concept_id }}">{{ concept.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Programa / Carrera</label>
                        <select name="program_id" class="form-select" required>
                            <option value="" disabled selected>Seleccione el programa...</option>
                            {% for prog in programs %}
                            <option value="{{ prog.program_id }}">{{ prog.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Monto en Bolívares (Bs.)</label>
                        <input type="number" step="0.01" name="value_bs" class="form-control" placeholder="0.00" required>
                    </div>

                    <button type="submit" class="btn btn-primary">Guardar Tarifa</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% extends "base.html" %}

{% block title %}Asignar Tarifa{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12"><h1 class="mb-4">Establecer Precio por Concepto</h1></div>
</div>

<div class="row">
    <div class="col-lg-7"> 
        <div class="card shadow-sm">
            <div class="card-body">
                <form method="POST" action="/fees/schedules/create">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    
                    <div class="mb-3">
                        <label class="form-label">Seleccionar Concepto</label>
                        <select class="form-select" name="fee_concept_id" required>
                            {% for c in concepts %}<option value="{{ c.concept_id }}">{{ c.name }}</option>{% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Aplicar a Programa</label>
                        <select class="form-select" name="program_id" required>
                            {% for p in programs %}<option value="{{ p.id }}">{{ p.name }}</option>{% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Monto (Precio)</label>
                        <div class="input-group">
                            <span class="input-group-text">$</span>
                            <input type="number" step="0.01" class="form-control" name="amount" required>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end mt-4">
                        <a href="/fees/schedules/list" class="btn btn-secondary me-2">Cancelar</a>
                        <button type="submit" class="btn btn-primary">Fijar Precio</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
